[tox]
requires = tox>=4.2
env_list = py{311,312,313,314,315}-fastapi{0110,0115}-sqlalchemy20, py311-minimum, quality

[testenv]
description = Full suite with the unchanged 100% coverage gate
deps =
    -r{toxinidir}/scripts/dev-requirements.txt
    sqlalchemy20: sqlalchemy[asyncio]>=2.0.30,<2.1
    fastapi0110: fastapi>=0.110,<0.115
    fastapi0115: fastapi>=0.115
commands = python -m pytest fastapi_notification/tests --cov-report=term-missing --cov-report=json:{envtmpdir}/coverage.json {posargs}
package = editable

[testenv:py311-minimum]
base_python = python3.11
deps =
    {[testenv]deps}
    fastapi==0.110.0
    sqlalchemy[asyncio]==2.0.30
    pydantic==2.7.0
    pydantic-settings==2.3.0

[testenv:quality]
base_python = python3.15
deps = -r{toxinidir}/scripts/dev-requirements.txt
commands =
    python -m black --check fastapi_notification
    python -m isort --check-only fastapi_notification
    python -m docformatter --check --recursive --wrap-summaries 88 --wrap-descriptions 88 fastapi_notification
    python -m pylint fastapi_notification --rcfile=pyproject.toml
    python -m mypy fastapi_notification
    python -m bandit -c pyproject.toml -r fastapi_notification

[testenv:database]
base_python = python3.15
pass_env = NOTIFICATION_TEST_DATABASE_URL
deps =
    {[testenv]deps}
    asyncpg>=0.29,<1
    aiomysql>=0.2,<0.4
    pymysql[rsa]>=1.1,<2
commands = python -m pytest fastapi_notification/tests --database-url={env:NOTIFICATION_TEST_DATABASE_URL} --no-cov {posargs}

[testenv:bandit]
base_python = python3.15
deps = bandit[toml]>=1.7.9,<2
commands = python -m bandit -c pyproject.toml -r fastapi_notification

[testenv:pre-commit]
deps = pre-commit>=3.5,<4
commands = pre-commit run --all-files

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315
