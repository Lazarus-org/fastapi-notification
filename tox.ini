[tox]
requires =
    tox>=4.2
env_list =
    py{313, 312, 311, 310, 39}-fastapi{0110, 0115}-sqlalchemy20

[testenv]
description = Run the pytest suite against several FastAPI versions
deps =
    pytest
    pytest-asyncio
    pytest-cov
    httpx
    aiosqlite
    greenlet
    pydantic>=2.7
    pydantic-settings>=2.3
    sqlalchemy20: sqlalchemy[asyncio]<2.1,>=2.0.30
    fastapi0110: fastapi<0.115,>=0.110
    fastapi0115: fastapi>=0.115
commands =
    pytest --cov=fastapi_notification --cov-report=html
develop = True

[testenv:bandit]
description = Run security checks
skip_install = true
deps =
    bandit
commands =
    bandit -r fastapi_notification

[testenv:pre-commit]
description = Run pre-commit hooks
skip_install = true
deps =
    pre-commit
commands =
    pre-commit run --all-files

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
