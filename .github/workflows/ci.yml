name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      distribution_in_release:
        description: The release build job validates its own distribution artifact
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    name: Python ${{ matrix.python }} / SQLite / 100% coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install poetry==2.5.1
      - run: poetry check --lock
      - run: poetry sync --with dev --no-interaction
      - run: poetry run pytest fastapi_notification/tests --cov-report=term-missing --cov-report=json:coverage.json --junitxml=tests.xml
      - name: Minimum framework combination
        if: matrix.python == '3.11'
        run: |
          poetry run pip install fastapi==0.110.0 'sqlalchemy[asyncio]==2.0.30' pydantic==2.7.0 pydantic-settings==2.3.0
          poetry run pip check
          poetry run pytest fastapi_notification/tests --cov-report=term-missing --cov-report=json:minimum-coverage.json --junitxml=minimum-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-${{ matrix.python }}
          path: |
            tests.xml
            coverage.json
            minimum-tests.xml
            minimum-coverage.json
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - run: python -m pip install poetry==2.5.1
      - run: poetry check --lock
      - run: poetry sync --with dev --no-interaction
      - run: poetry run black --check fastapi_notification scripts/check_packaging.py
      - run: poetry run isort --check-only fastapi_notification scripts/check_packaging.py
      - run: poetry run docformatter --check --recursive --wrap-summaries 88 --wrap-descriptions 88 fastapi_notification scripts/check_packaging.py
      - run: poetry run pylint fastapi_notification scripts/check_packaging.py --rcfile=pyproject.toml
      - run: poetry run mypy fastapi_notification scripts/check_packaging.py
      - run: poetry run bandit -c pyproject.toml -r fastapi_notification
      - run: poetry run pip check
  databases:
    name: Real PostgreSQL 17.5 and MySQL 8.4
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5
        env:
          POSTGRES_USER: notification
          POSTGRES_PASSWORD: notification
          POSTGRES_DB: notification_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U notification -d notification_test"
          --health-interval=10s --health-timeout=5s --health-retries=10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: notification_test
          MYSQL_USER: notification
          MYSQL_PASSWORD: notification
          MYSQL_ROOT_PASSWORD: isolated-test-root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -unotification -pnotification"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - run: python -m pip install poetry==2.5.1
      - run: poetry check --lock
      - run: poetry sync --with dev,database --no-interaction
      - name: PostgreSQL runtime and independent sessions
        run: poetry run pytest fastapi_notification/tests --database-url postgresql+asyncpg://notification:notification@127.0.0.1:5432/notification_test --no-cov --junitxml=postgresql.xml
      - name: MySQL runtime, REPEATABLE READ races and reference migration
        run: poetry run pytest fastapi_notification/tests --database-url mysql+aiomysql://notification:notification@127.0.0.1:3306/notification_test --no-cov --junitxml=mysql.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: databases
          path: |
            postgresql.xml
            mysql.xml
  distribution:
    if: ${{ !inputs.distribution_in_release }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - run: python -m pip install poetry==2.5.1
      - run: poetry check --lock
      - run: python scripts/check_packaging.py
      - run: poetry build
      - run: python scripts/check_packaging.py --dist-dir dist
      - name: Clean wheel installation and FastAPI persistence smoke test
        run: |
          python -m venv "$RUNNER_TEMP/clean-wheel"
          "$RUNNER_TEMP/clean-wheel/bin/python" -m pip install dist/*.whl aiosqlite
          "$RUNNER_TEMP/clean-wheel/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean-wheel/bin/python" -I "$GITHUB_WORKSPACE/scripts/wheel_smoke.py"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
