services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
      POSTGRES_DB: notification_test
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification_test"]
      interval: 5s
      retries: 20
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: notification
      MYSQL_USER: notification
      MYSQL_PASSWORD: notification
      MYSQL_DATABASE: notification_test
    ports: ["53306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pnotification"]
      interval: 5s
      retries: 30
