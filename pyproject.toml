[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core" ]

[tool.poetry]
name = "fastapi-notification"
version = "1.0.0"
description = "A FastAPI package developed by Lazarus for efficiently handling notifications through various APIs"
authors = [ "ARYAN-NIKNEZHAD <aryan513966@gmail.com>" ]
license = "MIT"
readme = "README.md"
keywords = [ "fastapi_notification", "fastapi", "notification", "fastapi-notification" ]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: AsyncIO",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

packages = [
  { include = "fastapi_notification" },
]

exclude = [ "fastapi_notification/tests" ]
include = [ { path = "migrations", format = "sdist" } ]

[tool.poetry.urls]
"Documentation" = "https://fastapi-notification.readthedocs.io"
"Source Code" = "https://github.com/Lazarus-org/fastapi-notification"
"Changelog" = "https://github.com/lazarus-org/fastapi-notification/blob/main/CHANGELOG.md"
"Issues" = "https://github.com/lazarus-org/fastapi-notification/issues"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = ">=0.110"
sqlalchemy = { version = "^2.0.30", extras = [ "asyncio" ] }
pydantic = "^2.7"
pydantic-settings = "^2.3"
tzdata = ">=2024.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-asyncio = ">=0.24,<1.3"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
aiosqlite = ">=0.20,<0.23"
greenlet = "^3.0.3"
alembic = "^1.13.2"
pylint = ">=4.1.3,<5"
mypy = "^1.11.1"
isort = ">=5.13.2,<7.0.0"
black = "^24.4.2"
commitizen = ">=3.28,<5.0"
pre-commit = "^3.5.0"
bandit = { extras = [ "toml" ], version = "^1.7.9" }
tox = "^4.16.0"
sphinx = ">=6.2.1,<8.0.0"
sphinx-rtd-theme = "^2.0.0"
docformatter = "^1.7.5"
codecov = "^2.1.13"
python-semantic-release = ">=9.8.8,<11.0.0"

[tool.poetry.group.database]
optional = true

[tool.poetry.group.database.dependencies]
asyncpg = ">=0.29,<1"
aiomysql = ">=0.2,<0.4"
pymysql = { version = ">=1.1,<2", extras = [ "rsa" ] }

[tool.black]
line-length = 88
exclude = '''
/(
    \.git
  | \.venv
  | \.tox
  | build
  | dist
  | migrations
  | venv
  | env
  | __pycache__
  | node_modules
  | \.mypy_cache
  | \.pytest_cache
  | .*\.egg-info
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip = [
  "venv",
  ".venv",
  ".tox",
  "build",
  "dist",
  ".git",
  "__pycache__",
  "*.egg-info",
  ".mypy_cache",
  ".pytest_cache",
  "migrations",
  "node_modules",
  "env",
]

[tool.pylint]
disable = [
  "C0103", # Invalid constant name
  "C0114", # Missing module docstring
  "C0115", # Missing class docstring
  "C0116", # Missing function or method docstring
  "E1101", # Instance of 'Foo' has no 'bar' member
  "W0212", # Access to a protected member
  "C0301", # Line too long
  "C0411", # Wrong import order
  "W0611", # Unused imports
  "W0613", # Unused arguments
  "W0622", # Redefining built-in names
  "R0903", # Too few public methods
  "R0801", # Duplicate code
  "W0621",
  "C0415",
  "R1719",
  "R1705",
  "R0401",
]
max-line-length = 88
max-positional-arguments = 15
ignore = [
  "tests",
  "migrations/*",
  "venv/*",
  "build/*",
  "dist/*",
  ".git/*",
  ".tox/*",
  "__pycache__/*",
  "*.egg-info/*",
  ".mypy_cache/*",
  ".pytest_cache/*",
]
load-plugins = [
  "pylint.extensions.docparams",
]

const-rgx = "([A-Z_][A-Z0-9_]*)|(__.*__)"
attr-rgx = "[a-z_][a-z0-9_]{2,30}$"
variable-rgx = "[a-z_][a-z0-9_]{2,30}$"
argument-rgx = "[a-z_][a-z0-9_]{2,30}$"
method-rgx = "[a-z_][a-z0-9_]{2,30}$"
function-rgx = "[a-z_][a-z0-9_]{2,30}$"
class-rgx = "[A-Z_][a-zA-Z0-9]+$"
module-rgx = "(([a-z_][a-z0-9_]*)|(__.*__))$"

[tool.pytest.ini_options]
python_files = [ "tests.py", "test_*.py" ]
testpaths = [ "fastapi_notification/tests" ]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov --cov-report=term-missing --cov-report=html --cov-fail-under=100"
markers = [
  "models: Marks tests related to all database models in the project.",
  "models_notification: Marks tests for the Notification model, including creation and model-specific methods.",
  "models_notification_recipient: Marks tests related to the NotificationRecipient model.",
  "models_notification_seen: Marks tests for the NotificationSeen model, which track when notifications have been seen.",
  "models_deleted_notification: Marks tests for handling deleted notifications, including soft logic.",
  "models_content_type: Marks tests for the ContentType model backing generic relations.",
  "models_permissions: Marks tests for the notification permission class.",
  "api: Marks tests related to the FastAPI routers as a whole.",
  "api_routes: Marks tests for API routes, covering endpoints, request handling, and response generation.",
  "api_routes_notification: Marks tests for routes handling notification-related API operations.",
  "api_routes_activity: Marks tests for routes related to activity-related operations in the API.",
  "api_paginations: Marks tests for pagination in the API, ensuring correct behavior of paginated responses.",
  "api_schemas: Marks tests for Pydantic schemas, including validation, data transformation, and response formatting.",
  "api_schemas_dynamic_notification: Marks tests for the dynamic notification schema.",
  "api_schemas_group: Marks tests for schemas that handle group-related data.",
  "api_filters: Marks tests for query parameter filtering, ordering and search.",
  "api_throttlings: Marks tests for throttling mechanisms, ensuring the correct limiting of API requests.",
  "api_dependencies: Marks tests for the reusable FastAPI dependencies.",
  "utils: Marks tests for general utility functions used across the project.",
  "utils_title_generator: Marks tests for the title generation utility.",
  "utils_naturaltime: Marks tests for the human readable time utility.",
  "settings: Marks tests for settings and configurations in the project.",
  "settings_conf: Marks tests related to loading project-specific settings and configurations.",
  "settings_checks: Marks tests for settings validation, ensuring that required settings are correctly configured.",
  "validators: Marks tests for custom validators used throughout the project.",
  "config_validators: Marks tests for configuration validators that validate the config values in project settings.",
  "managers: Marks tests for the data access layer, ensuring it performs filtering and querying correctly.",
  "decorators: Marks tests for custom Python decorators used in the project.",
  "decorators_route: Marks tests for route-related decorators.",
  "mixins: Marks tests for the reusable router mixins.",
]

norecursedirs = [
  "migrations",
  "env",
  "venv",
  ".venv",
  "dist",
  "build",
]

[tool.coverage.run]
source = [ "fastapi_notification" ]
# SQLAlchemy runs async database calls inside greenlets; without this, coverage
# loses the trace at every switch and under-reports the lines after an await.
concurrency = [ "thread", "greenlet" ]
omit = [
  "*/tests/*",
  "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self\\.debug",
  "raise AssertionError",
  "if 0:",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "@overload",
]

[tool.mypy]
mypy_path = "stubs"
disallow_untyped_calls = true
disallow_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true
exclude = """
^docs/conf.py|
^build/|
^tests/|
^stubs/
"""

[tool.bandit]
targets = [ "./fastapi_notification" ]
exclude_dirs = [
  "tests",
  "migrations",
]
severity = "medium"
confidence = "medium"
max_lines = 500
progress = true
reports = true
output_format = "screen"
output_file = "bandit_report.txt"
include = [ "B101", "B102" ]
exclude_tests = [ "B301", "B302" ]

[tool.bandit.plugins]
B104 = { check_typed_list = true }

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.0.0"
version_files = [ "pyproject.toml" ]
tag_format = "v$version"

[tool.commitizen.settings]
increment_types = [ "feat", "fix", "refactor" ]

[tool.semantic_release]
version_toml = [ "pyproject.toml:tool.poetry.version" ]
assets = [  ]
build_command_env = [  ]
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "emoji"
logging_use_named_masks = false
major_on_zero = true
allow_zero_version = true
no_git_verify = false
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.changelog]
template_dir = "templates"
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = [  ]

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "semantic-release <semantic-release>"

[tool.semantic_release.commit_parser_options]
allowed_tags = [ "build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test" ]
minor_tags = [ "feat" ]
patch_tags = [ "fix", "perf" ]
default_bump_level = 0
parse_emoji = true

[tool.semantic_release.remote]
name = "origin"
token = ""
type = "github"
ignore_token_for_push = false
insecure = false

[tool.semantic_release.publish]
dist_glob_patterns = [ "dist/*" ]
upload_to_vcs_release = true
